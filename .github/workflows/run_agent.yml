name: Oboe Learning Agent Runner

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic name (or "random")'
        required: false
        default: 'random'
      resume:
        description: 'Resume last active chat (true/false)'
        required: false
        default: 'false'
      level_up:
        description: 'Target only level-up topics (true/false)'
        required: false
        default: 'false'
      pin:
        description: 'Pin specific curriculum track (cpp, arch, os, ds, dl, maths, or none)'
        required: false
        default: 'none'
      duration:
        description: 'Maximum run duration in minutes (stops cleanly)'
        required: false
        default: 'none'

concurrency:
  group: oboe-learning-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows the runner to commit updated files back to your private repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Create Env and Session State Files
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env.local
          echo "GROQ_API_KEY2=${{ secrets.GROQ_API_KEY2 }}" >> .env.local
          echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}" >> .env.local
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" >> .env.local
          echo "OBOE_URL=https://oboe.com" >> .env.local
          echo '${{ secrets.OBOE_STORAGE_STATE }}' > data/state.json


      - name: Run Agent
        run: |
          ARGS=("-u" "main.py" "learn" "--headless")
          if [ "${{ github.event.inputs.resume }}" = "true" ]; then
            ARGS+=("--resume")
          elif [ -n "${{ github.event.inputs.topic }}" ] && [ "${{ github.event.inputs.topic }}" != "random" ]; then
            ARGS+=("--topic" "${{ github.event.inputs.topic }}")
          else
            ARGS+=("--topic" "random")
          fi
          if [ "${{ github.event.inputs.level_up }}" = "true" ]; then
            ARGS+=("--level-up")
          fi
          if [ -n "${{ github.event.inputs.pin }}" ] && [ "${{ github.event.inputs.pin }}" != "none" ]; then
            ARGS+=("--pin" "${{ github.event.inputs.pin }}")
          fi
          if [ -n "${{ github.event.inputs.duration }}" ] && [ "${{ github.event.inputs.duration }}" != "none" ]; then
            ARGS+=("--max-duration" "${{ github.event.inputs.duration }}")
          fi
          echo "Executing: python ${ARGS[*]}"
          exec python "${ARGS[@]}"



      - name: Commit & Push Updated Learning State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json tracks/*.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update learning metrics and tracks [skip ci]" && git push)

      - name: Send Telegram Session Summary
        if: always()
        run: |
          python -u -c '
          import json, urllib.request, urllib.parse, os, sys, html

          token = os.environ.get("TG_TOKEN", "")
          chat_id = os.environ.get("TG_CHAT", "")
          if not token or not chat_id:
              print("Telegram credentials not set, skipping notification.")
              sys.exit(0)

          # Try to read agent_state.json
          try:
              with open("data/agent_state.json") as f:
                  s = json.load(f)
          except Exception:
              s = {}

          if not s:
              msg = "🛑 <b>Oboe Session Cancelled!</b>\n\nAgent was stopped during setup phase before starting."
          else:
              raw_topic = s.get("topic", "Unknown")
              topic = html.escape(str(raw_topic))
              elapsed = s.get("elapsed_seconds", 0)
              mcqs_total = s.get("mcqs_total", 0)
              mcqs_correct = s.get("mcqs_correct", 0)
              mcqs_wrong = s.get("mcqs_wrong", 0)
              today_h = s.get("today_ist_hours", 0)
              today_m = s.get("today_ist_minutes", 0)
              skills = s.get("achieved_skills", {})

              mins, secs = elapsed // 60, elapsed % 60
              status = s.get("status", "COMPLETED")

              if status == "CANCELLED":
                  msg = "🛑 <b>Oboe Session Stopped!</b>\n\n"
              else:
                  msg = "🎉 <b>Oboe Session Complete!</b>\n\n"
              msg += f"📚 <b>Topic:</b> {topic}\n"
              msg += f"⏱️ <b>Session Time:</b> {mins}m {secs}s\n"
              msg += f"📊 <b>MCQs:</b> {mcqs_correct}/{mcqs_total} correct"
              if mcqs_wrong > 0:
                  msg += f" ({mcqs_wrong} wrong)"
              msg += f"\n⏱️ <b>Today (IST):</b> {today_h}h {today_m}m\n"

              telemetry = s.get("telemetry", {})
              tot_calls = telemetry.get("total_api_calls", 0)
              tot_toks = telemetry.get("total_tokens", 0)
              providers_map = telemetry.get("providers", {})
              if tot_calls > 0:
                  msg += f"🧠 <b>LLM Calls:</b> {tot_calls} ({tot_toks} tokens)\n"
                  if providers_map:
                      prov_str = ", ".join([p.upper() + ": " + str(d.get("calls", 0)) for p, d in providers_map.items()])
                      msg += f"⚡ <b>Providers:</b> {prov_str}\n"



              if skills:
                  msg += "\n<b>📈 Skills Leveled Up:</b>\n"
                  for sk, lv in skills.items():
                      safe_sk = html.escape(str(sk))
                      msg += f"  • {safe_sk}: {lv}\n"

              else:
                  msg += "\nNo skill level-ups this session."

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          try:
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg, "parse_mode": "HTML"}).encode()
              urllib.request.urlopen(url, data=data)
              print("Telegram notification sent successfully (HTML).")
          except Exception as e:
              print(f"HTML notification failed: {e}. Trying plain text fallback...")
              try:
                  plain_msg = msg.replace("<b>", "").replace("</b>", "")
                  data_plain = urllib.parse.urlencode({"chat_id": chat_id, "text": plain_msg}).encode()
                  urllib.request.urlopen(url, data=data_plain)
                  print("Telegram notification sent successfully (Plain Text).")
              except Exception as fe:
                  print(f"Plain text fallback also failed: {fe}")
          '
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.ALLOWED_TELEGRAM_USER_ID }}
