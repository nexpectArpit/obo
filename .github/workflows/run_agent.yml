name: Oboe Learning Agent Runner

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic name (or "random")'
        required: false
        default: 'random'
      resume:
        description: 'Resume last active chat (true/false)'
        required: false
        default: 'false'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows the runner to commit updated files back to your private repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get Playwright Version
        id: pw-version
        run: echo "version=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-chromium

      - name: Install Playwright Browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS Dependencies Only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Create Env and Session State Files
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env.local
          echo "GROQ_API_KEY2=${{ secrets.GROQ_API_KEY2 }}" >> .env.local
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" >> .env.local
          echo "OBOE_URL=https://oboe.com" >> .env.local
          echo '${{ secrets.OBOE_STORAGE_STATE }}' > state.json

      - name: Run Agent
        run: |
          CMD="python -u main.py learn --headless"
          if [ "${{ github.event.inputs.resume }}" = "true" ]; then
            CMD="$CMD --resume"
          elif [ -n "${{ github.event.inputs.topic }}" ] && [ "${{ github.event.inputs.topic }}" != "random" ]; then
            CMD="$CMD --topic \"${{ github.event.inputs.topic }}\""
          else
            CMD="$CMD --topic random"
          fi
          echo "Executing: $CMD"
          eval $CMD



      - name: Commit & Push Updated Learning State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add learned_skills.json topics.json time_tracker.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update learning metrics [skip ci]" && git push)

      - name: Send Telegram Session Summary
        if: always()
        run: |
          python -u -c '
          import json, urllib.request, urllib.parse, os, sys

          token = os.environ.get("TG_TOKEN", "")
          chat_id = os.environ.get("TG_CHAT", "")
          if not token or not chat_id:
              print("Telegram credentials not set, skipping notification.")
              sys.exit(0)

          # Try to read agent_state.json
          try:
              with open("agent_state.json") as f:
                  s = json.load(f)
          except Exception:
              s = {}

          topic = s.get("topic", "Unknown")
          elapsed = s.get("elapsed_seconds", 0)
          mcqs_total = s.get("mcqs_total", 0)
          mcqs_correct = s.get("mcqs_correct", 0)
          mcqs_wrong = s.get("mcqs_wrong", 0)
          today_h = s.get("today_ist_hours", 0)
          today_m = s.get("today_ist_minutes", 0)
          skills = s.get("achieved_skills", {})

          mins, secs = elapsed // 60, elapsed % 60

          msg = "🎉 <b>Oboe Session Complete!</b>\n\n"
          msg += f"📚 <b>Topic:</b> {topic}\n"
          msg += f"⏱️ <b>Session Time:</b> {mins}m {secs}s\n"
          msg += f"📊 <b>MCQs:</b> {mcqs_correct}/{mcqs_total} correct"
          if mcqs_wrong > 0:
              msg += f" ({mcqs_wrong} wrong)"
          msg += f"\n⏱️ <b>Today (IST):</b> {today_h}h {today_m}m\n"

          if skills:
              msg += "\n<b>📈 Skills Leveled Up:</b>\n"
              for sk, lv in skills.items():
                  msg += f"  • {sk}: Level {lv}\n"
          else:
              msg += "\nNo skill level-ups this session."

          try:
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg, "parse_mode": "HTML"}).encode()
              urllib.request.urlopen(url, data=data)
              print("Telegram notification sent.")
          except Exception as e:
              print(f"Telegram notification failed: {e}")
          '
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.ALLOWED_TELEGRAM_USER_ID }}
