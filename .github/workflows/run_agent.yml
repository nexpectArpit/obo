name: Oboe Learning Agent Runner

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic name (or "random")'
        required: false
        default: 'random'
      resume:
        description: 'Resume last active chat (true/false)'
        required: false
        default: 'false'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows the runner to commit updated files back to your private repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Restore Browser Session Cache
        uses: actions/cache/restore@v4
        with:
          path: .user_data
          key: oboe-session-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: |
            oboe-session-

      - name: Create Env File
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env.local
          echo "GROQ_API_KEY2=${{ secrets.GROQ_API_KEY2 }}" >> .env.local
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" >> .env.local
          echo "OBOE_URL=https://oboe.com" >> .env.local

      - name: Run Agent
        run: |
          CMD="python -u main.py learn --headless"
          if [ "${{ github.event.inputs.resume }}" = "true" ]; then
            CMD="$CMD --resume"
          elif [ -n "${{ github.event.inputs.topic }}" ] && [ "${{ github.event.inputs.topic }}" != "random" ]; then
            CMD="$CMD --topic \"${{ github.event.inputs.topic }}\""
          else
            CMD="$CMD --topic random"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Save Browser Session Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .user_data
          key: oboe-session-${{ github.run_id }}-${{ github.run_number }}

      - name: Commit & Push Updated Learning State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add learned_skills.json topics.json time_tracker.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update learning metrics [skip ci]" && git push)
